name: Test VPC configuration inputs (subnets and securitygroups)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with VPC config inputs (expect failure with fake creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function-vpc
          zip_file: /dev/null
          dry_run: "true"
          publish: "false"
          subnets: subnet-12345678,subnet-87654321
          securitygroups: sg-12345678,sg-87654321

      - name: Assert action ran with VPC config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth error.
          # We are verifying the action accepts and processes VPC configuration inputs.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with VPC config inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
