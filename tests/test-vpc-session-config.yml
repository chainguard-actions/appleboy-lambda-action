name: Test VPC, session token, profile, layers, role, tracing, and reversion config
on:
  workflow_dispatch:
jobs:
  test-vpc-session-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/vpc_handler.py
          zip /tmp/vpc_handler.zip /tmp/vpc_handler.py

      - id: action
        name: Run Lambda deploy action with VPC, session, profile, layers, role, tracing, reversion
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_session_token: AQoDYXdzEJr//fake-session-token-for-testing==
          aws_profile: default
          function_name: my-vpc-function
          zip_file: /tmp/vpc_handler.zip
          dry_run: "true"
          role: arn:aws:iam::123456789012:role/lambda-execution-role
          layers: arn:aws:lambda:us-east-1:123456789012:layer:my-layer:1
          subnets: subnet-0123456789abcdef0,subnet-0123456789abcdef1
          securitygroups: sg-0123456789abcdef0
          tracing_mode: Active
          reversion_id: abc123-revision-id

      - name: Assert action ran with VPC and session config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth/access error.
          # That is expected — what we are testing is that the action starts up correctly,
          # parses all VPC/session/profile/layers/role/tracing/reversion inputs,
          # and attempts to contact AWS (rather than crashing on startup).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with VPC/session config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
