name: Test function configuration inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-test-function
          zip_file: function.zip
          handler: index.handler
          role: arn:aws:iam::123456789012:role/lambda-role
          runtime: nodejs18.x
          environment: "KEY1=value1,KEY2=value2"
          layers: "arn:aws:lambda:us-east-1:123456789012:layer:my-layer:1"
          description: "My test Lambda function"
          tracing_mode: Active
          dry_run: "true"
      - name: Assert action ran (expected failure with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with function config inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
