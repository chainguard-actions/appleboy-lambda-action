name: Test layers, VPC, and source inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-test-function
          source: handler.js,package.json
          layers: arn:aws:lambda:us-east-1:123456789012:layer:my-layer:1
          subnets: subnet-0123456789abcdef0
          securitygroups: sg-0123456789abcdef0
          dry_run: true
        continue-on-error: true
      - name: Assert action ran with layers, vpc, and source inputs
        run: |
          echo "Action completed (dry_run with layers, subnets, securitygroups, source)"
          echo "PASS: inputs layers, subnets, securitygroups, source were accepted"
