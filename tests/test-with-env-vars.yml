name: Test with environment variables and VPC config (dry run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy zip file
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/handler.py
          zip /tmp/function.zip /tmp/handler.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: eu-west-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-env-test-function
          zip_file: /tmp/function.zip
          dry_run: true
          publish: true
          memory_size: 256
          timeout: 60
          handler: handler.handler
          runtime: python3.9
          environment: "KEY1=value1,KEY2=value2"
          subnets: subnet-12345678
          securitygroups: sg-12345678
          description: Test function with env vars and VPC
      - name: Assert action ran with environment and VPC inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With fake credentials, AWS auth will fail — that is expected behavior
          # We verify the action was invoked and completed (success or failure)
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced a result with env vars and VPC config"
          else
            echo "FAIL: action did not run properly, outcome=${{ steps.action.outcome }}"
            exit 1
          fi
