name: Test advanced configuration options
on:
  workflow_dispatch:
jobs:
  test-advanced-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/handler.py
          zip /tmp/handler.zip /tmp/handler.py

      - id: action
        name: Run Lambda deploy action with advanced config in dry-run mode
        uses: .
        continue-on-error: true
        with:
          aws_region: eu-west-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-advanced-function
          zip_file: /tmp/handler.zip
          dry_run: "true"
          publish: "true"
          handler: handler.handler
          runtime: python3.9
          memory_size: 256
          timeout: 30
          environment: "KEY1=value1,KEY2=value2"
          description: "Test function deployed by CI"
          debug: "true"

      - name: Assert action ran with advanced config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth/access error.
          # That is expected — what we are testing is that the action starts up correctly,
          # parses all advanced configuration inputs, and attempts to contact AWS.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with advanced config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
