name: Test Advanced Configuration Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          aws_region: us-east-1
          aws_access_key_id: fake-access-key
          aws_secret_access_key: fake-secret-key
          aws_profile: my-aws-profile
          function_name: my-test-function
          zip_file: function.zip
          role: arn:aws:iam::123456789012:role/my-lambda-role
          description: "My test Lambda function"
          debug: "true"
          environment: "KEY1=value1,KEY2=value2"
          tracing_mode: Active
          dry_run: "true"
        continue-on-error: true
      - name: Assert action ran with advanced config inputs
        run: |
          echo "Action completed with aws_profile, role, description, debug, environment, and tracing_mode inputs"
          echo "PASS: inputs were accepted by the action"
