name: Test advanced configuration options
on:
  workflow_dispatch:

jobs:
  test-advanced-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy zip file for testing
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/handler.py
          zip /tmp/advanced_lambda.zip /tmp/handler.py

      - name: Run action with advanced configuration in dry_run mode
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: eu-west-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-lambda-advanced
          zip_file: /tmp/advanced_lambda.zip
          dry_run: "true"
          publish: "true"
          memory_size: 256
          timeout: 30
          handler: handler.handler
          runtime: python3.9
          description: "Test Lambda function for CI"
          environment: "KEY1=value1,KEY2=value2"

      - name: Assert action ran (outcome is either success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (AWS auth failure is expected with fake credentials)"
