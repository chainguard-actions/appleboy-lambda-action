name: Test dry_run mode with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in dry_run mode with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function-dry-run
          zip_file: /dev/null
          dry_run: true
          publish: false

      - name: Assert action failed (invalid credentials even in dry_run)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials in dry_run mode, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed in dry_run mode with invalid AWS credentials"
