name: Test dry_run mode
on:
  workflow_dispatch:

jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy zip file for testing
        run: |
          echo "dummy lambda content" > /tmp/dummy_handler.py
          zip /tmp/dummy_lambda.zip /tmp/dummy_handler.py

      - name: Run action in dry_run mode (expect AWS auth failure, not input error)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-lambda-function
          zip_file: /tmp/dummy_lambda.zip
          dry_run: "true"
          publish: "false"

      - name: Assert action ran (outcome is either success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (AWS auth failure is expected with fake credentials)"
