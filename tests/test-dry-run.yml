name: Test dry run validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy zip file
        run: |
          echo "dummy lambda content" > /tmp/lambda_function.py
          zip /tmp/lambda.zip /tmp/lambda_function.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-test-function
          zip_file: /tmp/lambda.zip
          dry_run: true
          publish: false
      - name: Assert action ran (dry_run may fail due to invalid credentials but should not crash unexpectedly)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # dry_run with fake credentials will fail at AWS auth, which is expected
          # The important thing is the action was invoked and produced a meaningful error
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced a result"
          else
            echo "FAIL: action did not run properly, outcome=${{ steps.action.outcome }}"
            exit 1
          fi
