name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "dummy lambda code" > /tmp/lambda.js
          zip /tmp/lambda.zip /tmp/lambda.js

      - name: Run action in dry-run mode (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function
          zip_file: /tmp/lambda.zip
          dry_run: true

      - name: Assert action ran (failed due to invalid AWS credentials, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of misconfiguration)
          # Either 'success' (unlikely without real AWS) or 'failure' (expected with fake creds) is acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
