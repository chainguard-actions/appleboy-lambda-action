name: Test dry_run mode
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file for testing
        run: |
          echo "dummy lambda function" > /tmp/lambda_function.py
          zip /tmp/lambda.zip /tmp/lambda_function.py

      - name: Run action in dry_run mode
        id: deploy
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function
          zip_file: /tmp/lambda.zip
          dry_run: "true"
          publish: "false"

      - name: Assert action ran (dry_run with fake creds should fail at AWS auth)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, the action should either succeed (dry_run validation)
          # or fail at AWS authentication - both are acceptable outcomes
          # The important thing is the action was invoked and ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and completed (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
