name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "dummy lambda" > /tmp/lambda.js
          zip /tmp/lambda.zip /tmp/lambda.js

      - id: action
        name: Run Lambda deploy action in dry-run mode
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-test-function
          zip_file: /tmp/lambda.zip
          dry_run: "true"
          publish: "false"

      - name: Assert action ran (dry-run with fake creds should fail with auth error, not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth/access error.
          # That is expected — what we are testing is that the action starts up correctly,
          # parses inputs, and attempts to contact AWS (rather than crashing on startup).
          # A failure outcome here means the action ran and got an AWS error, which is correct.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
