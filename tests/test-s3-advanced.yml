name: Test advanced S3 and Lambda configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with s3_object_version, reversion_id, layers, and source inputs (expect failure with fake creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function-s3-advanced
          s3_bucket: my-test-deployment-bucket
          s3_key: my-deployment-package.zip
          s3_object_version: abc123def456
          reversion_id: rev-id-12345678-abcd-efgh-ijkl-mnopqrstuvwx
          layers: arn:aws:lambda:us-east-1:123456789012:layer:my-layer:1,arn:aws:lambda:us-east-1:123456789012:layer:my-other-layer:2
          source: /dev/null
          dry_run: "true"
          publish: "false"

      - name: Assert action ran with advanced S3 and Lambda inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth error.
          # We are verifying the action accepts s3_object_version, reversion_id,
          # layers, and source inputs without crashing on input parsing.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with advanced S3 and Lambda inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
