name: Test session token, profile, debug, reversion_id, role, and layers (dry run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy zip file
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/handler_layers.py
          zip /tmp/function_layers.zip /tmp/handler_layers.py
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_session_token: AQoDYXdzEJr//fake-session-token-for-testing
          aws_profile: default
          function_name: my-layers-test-function
          zip_file: /tmp/function_layers.zip
          dry_run: true
          publish: false
          debug: true
          reversion_id: abc123revision
          role: arn:aws:iam::123456789012:role/lambda-execution-role
          layers: arn:aws:lambda:us-east-1:123456789012:layer:my-layer:1
          handler: handler_layers.handler
          runtime: python3.9
      - name: Assert action ran with session token, profile, debug, reversion_id, role, and layers inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With fake credentials, AWS auth will fail — that is expected behavior
          # We verify the action was invoked and completed (success or failure)
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran and produced a result with session token, profile, debug, reversion_id, role, and layers inputs"
          else
            echo "FAIL: action did not run properly, outcome=${{ steps.action.outcome }}"
            exit 1
          fi
