name: Test S3 source deployment
on:
  workflow_dispatch:
jobs:
  test-s3-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Lambda deploy action with S3 source in dry-run mode
        uses: .
        continue-on-error: true
        with:
          aws_region: us-west-2
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-s3-test-function
          s3_bucket: my-deployment-bucket
          s3_key: deployments/lambda.zip
          dry_run: "true"
          publish: "false"

      - name: Assert action ran with S3 inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake AWS credentials, the action will fail with an auth/access error.
          # That is expected — what we are testing is that the action starts up correctly,
          # parses S3 inputs, and attempts to contact AWS (rather than crashing on startup).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed with S3 source inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
