name: Test VPC, image URI, and profile inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_profile: my-aws-profile
          function_name: my-test-function
          image_uri: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-image:latest
          subnets: "subnet-12345678,subnet-87654321"
          securitygroups: "sg-12345678,sg-87654321"
          reversion_id: abc123-revision-id
          dry_run: "true"
      - name: Assert action ran (expected failure with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with vpc/image/profile inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
