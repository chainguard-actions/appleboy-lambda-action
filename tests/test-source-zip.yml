name: Test source zip deployment
on:
  workflow_dispatch:
jobs:
  test-source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy source files for testing
        run: |
          mkdir -p /tmp/lambda_src
          echo "def handler(event, context): return 'hello'" > /tmp/lambda_src/handler.py

      - name: Run action with source input
        id: deploy
        uses: .
        continue-on-error: true
        with:
          aws_region: us-east-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function
          source: /tmp/lambda_src/handler.py
          dry_run: "true"
          publish: "false"
          runtime: python3.9
          handler: handler.handler

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, the action should either succeed or fail at AWS auth
          # The important thing is the action was invoked and ran (not skipped/cancelled)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and completed (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
