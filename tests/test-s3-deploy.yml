name: Test S3 deployment scenario
on:
  workflow_dispatch:
jobs:
  test-s3-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with S3 source (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: us-west-2
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-lambda-function
          s3_bucket: my-deployment-bucket
          s3_key: deployments/lambda.zip
          dry_run: true
          publish: false

      - name: Assert action ran (failed due to invalid AWS credentials, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of misconfiguration)
          # Either 'success' (unlikely without real AWS) or 'failure' (expected with fake creds) is acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
