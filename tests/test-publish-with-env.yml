name: Test publish with environment variables
on:
  workflow_dispatch:
jobs:
  test-publish-with-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file
        run: |
          echo "dummy lambda code" > /tmp/handler.py
          zip /tmp/function.zip /tmp/handler.py

      - name: Run action with publish and environment variables
        id: action
        uses: .
        continue-on-error: true
        with:
          aws_region: eu-west-1
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: my-python-function
          zip_file: /tmp/function.zip
          publish: true
          handler: handler.lambda_handler
          runtime: python3.9
          environment: "KEY1=value1,KEY2=value2"
          description: "Test deployment"
          memory_size: 128
          timeout: 30
          dry_run: true

      - name: Assert action ran (failed due to invalid AWS credentials, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of misconfiguration)
          # Either 'success' (unlikely without real AWS) or 'failure' (expected with fake creds) is acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran as expected (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
