name: Test default region and publish settings
on:
  workflow_dispatch:
jobs:
  test-default-region:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip file for testing
        run: |
          echo "def handler(event, context): return 'hello'" > /tmp/handler.py
          zip /tmp/lambda.zip /tmp/handler.py

      - name: Run action with default region (us-east-1) and publish=true
        id: deploy
        uses: .
        continue-on-error: true
        with:
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          function_name: test-function-default
          zip_file: /tmp/lambda.zip
          dry_run: "true"
          # publish defaults to true per action.yml
          # aws_region defaults to us-east-1 per action.yml

      - name: Assert action was invoked with defaults
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, the action should either succeed or fail at AWS auth
          # The important thing is the action was invoked and ran (not skipped/cancelled)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked and completed with defaults (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
